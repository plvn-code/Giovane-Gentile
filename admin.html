<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Адмін-панель — Giovane Gentile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --line:#e4e2dc; --ink:#1a1a1a; --muted:#8a8882; --accent:#1a1a1a; --ok:#1a7f37; --bg:#f7f6f3; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Montserrat',system-ui,sans-serif; color:var(--ink); background:var(--bg); }
    a { color:inherit; }
    .wrap { max-width:1180px; margin:0 auto; padding:0 24px; }

    /* Login */
    .login { min-height:100vh; display:grid; place-items:center; padding:24px; }
    .login__box { background:#fff; border:1px solid var(--line); border-radius:6px; padding:40px 34px; width:100%; max-width:380px; text-align:center; }
    .login__logo { font-family:'Bodoni Moda',serif; font-size:26px; margin-bottom:6px; }
    .login__sub { font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--muted); margin-bottom:26px; }
    .login input { width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:3px; font:inherit; margin-bottom:14px; }
    .login__err { color:#b00020; font-size:13px; min-height:18px; margin-bottom:8px; }

    header.top { background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
    .top__row { display:flex; align-items:center; justify-content:space-between; height:62px; }
    .top__logo { font-family:'Bodoni Moda',serif; font-size:20px; text-decoration:none; }
    .top__logo small { font-family:'Montserrat'; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); display:block; }
    .top__right { display:flex; gap:10px; align-items:center; }
    .tabs { display:flex; gap:6px; }
    .tab { padding:8px 16px; border:1px solid var(--line); background:#fff; border-radius:3px; cursor:pointer; font:inherit; font-size:13px; }
    .tab.active { background:var(--ink); color:#fff; border-color:var(--ink); }

    .btn { padding:9px 16px; border:1px solid var(--ink); background:var(--ink); color:#fff; border-radius:3px; cursor:pointer; font:inherit; font-size:13px; }
    .btn--ghost { background:#fff; color:var(--ink); }
    .btn--danger { background:#fff; color:#b00020; border-color:#e0bdbd; }
    .btn--sm { padding:6px 11px; font-size:12px; }

    main { padding:26px 0 80px; }
    .bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:12px; flex-wrap:wrap; }
    .bar h1 { font-family:'Bodoni Moda',serif; font-weight:500; font-size:26px; margin:0; }
    .search { padding:9px 12px; border:1px solid var(--line); border-radius:3px; font:inherit; min-width:220px; }
    .stat { font-size:13px; color:var(--muted); }

    table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:6px; overflow:hidden; font-size:13px; }
    th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
    th { background:#faf9f6; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
    tr:last-child td { border-bottom:none; }
    .thumb { width:40px; height:52px; object-fit:cover; border-radius:2px; background:#eee; }
    .pill { display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; }
    .pill--new { background:#eef6ff; color:#1b6ec2; }
    .pill--sale { background:#fdeeee; color:#c23030; }
    .pill--paid { background:#e8f6ec; color:var(--ok); }
    .pill--pending { background:#fff6e6; color:#b9770b; }
    select.status { padding:5px 8px; border:1px solid var(--line); border-radius:3px; font:inherit; font-size:12px; }

    /* Modal */
    .modal { position:fixed; inset:0; background:rgba(20,18,16,.5); display:grid; place-items:center; padding:20px; z-index:50; }
    .modal__box { background:#fff; border-radius:6px; width:100%; max-width:620px; max-height:90vh; overflow:auto; padding:26px 28px; }
    .modal__box h2 { font-family:'Bodoni Moda',serif; font-weight:500; margin:0 0 18px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .f { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
    .f label { font-size:12px; color:#555; }
    .f input, .f textarea, .f select { padding:9px 11px; border:1px solid var(--line); border-radius:3px; font:inherit; font-size:14px; }
    .f--full { grid-column:1 / -1; }
    .modal__actions { display:flex; justify-content:space-between; gap:10px; margin-top:12px; }
    [hidden] { display:none !important; }
    .muted { color:var(--muted); }
    @media (max-width:640px){ .grid2{ grid-template-columns:1fr; } .hide-sm{ display:none; } }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <section class="login" id="login">
    <div class="login__box">
      <div class="login__logo">Giovane Gentile</div>
      <div class="login__sub">Admin panel</div>
      <form id="login-form">
        <input type="password" id="login-pass" placeholder="Пароль адміністратора" autocomplete="current-password" required>
        <div class="login__err" id="login-err"></div>
        <button class="btn" style="width:100%" type="submit">Увійти</button>
      </form>
    </div>
  </section>

  <!-- APP -->
  <div id="app" hidden>
    <header class="top">
      <div class="wrap top__row">
        <a href="index.html" class="top__logo">Giovane Gentile<small>адмін-панель</small></a>
        <div class="top__right">
          <div class="tabs">
            <button class="tab active" data-tab="products">Товари</button>
            <button class="tab" data-tab="orders">Замовлення</button>
          </div>
          <button class="btn btn--ghost btn--sm" id="logout">Вийти</button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <!-- PRODUCTS -->
      <section id="view-products">
        <div class="bar">
          <h1>Товари</h1>
          <div style="display:flex; gap:10px; align-items:center;">
            <input class="search" id="prod-search" placeholder="Пошук за назвою, брендом, SKU…">
            <button class="btn" id="add-product">+ Додати товар</button>
          </div>
        </div>
        <p class="stat" id="prod-stat">Завантаження…</p>
        <table>
          <thead><tr>
            <th></th><th>Назва</th><th class="hide-sm">Категорія</th><th>Ціна</th>
            <th class="hide-sm">Прапорці</th><th></th>
          </tr></thead>
          <tbody id="prod-rows"></tbody>
        </table>
      </section>

      <!-- ORDERS -->
      <section id="view-orders" hidden>
        <div class="bar">
          <h1>Замовлення</h1>
          <button class="btn btn--ghost btn--sm" id="orders-refresh">Оновити</button>
        </div>
        <p class="stat" id="orders-stat">Завантаження…</p>
        <table>
          <thead><tr>
            <th>№ / дата</th><th>Клієнт</th><th class="hide-sm">Товари</th><th>Сума</th><th>Статус</th>
          </tr></thead>
          <tbody id="order-rows"></tbody>
        </table>
      </section>
    </main>
  </div>

  <!-- PRODUCT MODAL -->
  <div class="modal" id="prod-modal" hidden>
    <div class="modal__box">
      <h2 id="pm-title">Товар</h2>
      <form id="pm-form">
        <div class="grid2">
          <div class="f"><label>ID (напр. odyag-sorochky-9)</label><input id="pm-id" required></div>
          <div class="f"><label>Назва</label><input id="pm-name" required></div>
          <div class="f"><label>Бренд</label><input id="pm-brand"></div>
          <div class="f"><label>SKU</label><input id="pm-sku"></div>
          <div class="f"><label>Розділ</label>
            <select id="pm-catkey">
              <option value="odyag">Одяг</option><option value="vzuttya">Взуття</option><option value="aksesuary">Аксесуари</option>
            </select>
          </div>
          <div class="f"><label>Підрозділ (ключ, напр. sorochky)</label><input id="pm-subkey"></div>
          <div class="f"><label>Категорія (підпис, напр. Сорочки)</label><input id="pm-category"></div>
          <div class="f"><label>Матеріал</label><input id="pm-material"></div>
          <div class="f"><label>Колір</label><input id="pm-color"></div>
          <div class="f"><label>Ціна, ₴</label><input id="pm-price" type="number" required></div>
          <div class="f"><label>Стара ціна, ₴ (для Sale)</label><input id="pm-oldprice" type="number"></div>
          <div class="f"><label>Сортування</label><input id="pm-sort" type="number" value="0"></div>
          <div class="f f--full"><label>Опис (короткий)</label><textarea id="pm-desc" rows="2"></textarea></div>
          <div class="f f--full"><label>Фото (URL через кому)</label><textarea id="pm-images" rows="2" placeholder="https://… , https://…"></textarea></div>
          <div class="f"><label><input type="checkbox" id="pm-new"> Новинка</label></div>
          <div class="f"><label><input type="checkbox" id="pm-sale"> Sale</label></div>
          <div class="f"><label><input type="checkbox" id="pm-active" checked> Активний (показувати)</label></div>
        </div>
        <div class="login__err" id="pm-err"></div>
        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" id="pm-cancel">Скасувати</button>
          <button type="submit" class="btn" id="pm-save">Зберегти</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/supabase.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
